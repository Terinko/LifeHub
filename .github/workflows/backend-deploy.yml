name: Deploy Backend Infrastructure

# This tells GitHub to run this pipeline every time you push to the master/main branch
on:
  push:
    branches:
      - master
      - main

jobs:
  deploy-aws-cdk:
    name: Deploying to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Change this if your region is different (e.g., us-east-2)

      # Installs every npm workspace (apps/web, packages/*) from the root lockfile
      - name: Install Frontend Dependencies
        run: npm ci

      # Builds apps/web into apps/web/dist, which the CDK stack uploads to S3
      - name: Build Frontend
        run: npm run build

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      # Copies the GARMIN_PERSONAL_API_KEY secret into SSM Parameter Store,
      # where the Run Lambda reads it, so the key never lands in the
      # CloudFormation template or a Lambda environment variable.
      - name: Store Garmin key in Parameter Store
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: |
          if [ -n "$GARMIN_PERSONAL_API_KEY" ]; then
            aws ssm put-parameter --name /lifehub/garmin/personal-api-key \
              --type SecureString --overwrite \
              --value "$GARMIN_PERSONAL_API_KEY" > /dev/null
          fi

      - name: Deploy CDK Stack
        working-directory: ./backend
        # --require-approval never tells CDK not to pause and wait for a human to type 'y'
        run: npx cdk deploy --require-approval never
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FANTASY_ENC_KEY: ${{ secrets.FANTASY_ENC_KEY }}
