name: Deploy Backend Infrastructure

# This tells GitHub to run this pipeline every time you push to the master/main branch
on:
  push:
    branches:
      - master
      - main

jobs:
  deploy-aws-cdk:
    name: Deploying to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Change this if your region is different (e.g., us-east-2)

        # NEW: Install React dependencies (runs in root directory)
      - name: Install Frontend Dependencies
        run: npm install

      # NEW: Build the React app (creates the /dist folder)
      - name: Build Frontend
        run: npm run build

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Deploy CDK Stack
        working-directory: ./backend
        # --require-approval never tells CDK not to pause and wait for a human to type 'y'
        run: npx cdk deploy --require-approval never
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FANTASY_ENC_KEY: ${{ secrets.FANTASY_ENC_KEY }}
