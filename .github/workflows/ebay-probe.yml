name: eBay probe (temporary)

on:
  push:
    branches:
      - claude/project-thread-f16vm6
    paths:
      - .github/probe/**
      - .github/workflows/ebay-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/probe/ebay-probe.mjs
